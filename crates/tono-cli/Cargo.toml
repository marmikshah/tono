[package]
name = "tono"
description = "A deterministic sound engine — synthesis, instruments, songs, and adaptive game music, rendered byte-identically to audio. Includes a CLI that renders a SoundDoc to audio + analysis images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# cargo copies the workspace README into the package (same convention as
# tono-core), so the crates.io page of the CLI crate isn't blank.
readme = "../../README.md"
keywords = ["audio", "synthesis", "dsp", "chiptune", "gamedev"]
categories = ["multimedia::audio", "game-development"]

# docs.rs builds the full feature set so every optional API is documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# Feature-declared so a change to core's defaults can't silently unbuild this
# crate: the CLI re-exports + uses the analysis surface and checks .sf2 paths.
tono-core = { workspace = true, features = ["analysis", "sampler"] }
anyhow = { workspace = true }
clap = { workspace = true }
hound = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Optional, each behind the feature of the same purpose (see [features]).
cpal = { workspace = true, optional = true }
flacenc = { workspace = true, optional = true }
midly = { workspace = true, optional = true }
vorbis_rs = { workspace = true, optional = true }

# Features. All are off by default, so a plain `cargo install tono` builds the
# WAV-only CLI without a C toolchain or an audio backend:
#   encode  `--format flac|ogg` on every rendering command: FLAC through the
#           pure-Rust `flacenc`, OGG Vorbis through `vorbis_rs` (compiles
#           libvorbis with cc). WAV output needs no feature.
#   midi    `tono midi` (SoundDoc/Song -> Standard MIDI File) and
#           `tono import` (SMF -> SoundDoc/Song), through `midly`.
#   play    `tono play`: audition a document through the speakers via `cpal`.
# Enable them at install time: `cargo install tono --features midi,encode`.
[features]
encode = ["dep:flacenc", "dep:vorbis_rs"]
midi = ["dep:midly"]
play = ["dep:cpal"]

[dev-dependencies]
proptest = { workspace = true }
