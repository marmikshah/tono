[package]
name = "tono-core"
description = "The headless audio engine behind tono: synthesis graphs, DSP, deterministic rendering, instruments, songs, transport and analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tono-core"
readme = "README.md"
keywords = ["audio", "synthesis", "dsp", "chiptune", "gamedev"]
categories = ["multimedia::audio", "game-development"]
# The published package carries the library and its examples only. Benches and
# the regression suite stay in the repository; the one fixture a unit test
# embeds with `include_str!` is kept so `cargo test` compiles from the package.
exclude = [
    "/benches/",
    "/tests/",
    "!/tests/fixtures/parametric-impact.patch.json",
]

# docs.rs builds the full feature set so every optional API is documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = { workspace = true }
cpal = { workspace = true, optional = true }
image = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
rustysynth = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rustfft = { workspace = true }

[[bench]]
name = "render"
harness = false

# The speaker examples need an output device; the three headless ones
# (compose, play_instrument, runtime_mixer) build with the default features.
[[example]]
name = "adaptive"
required-features = ["cpal"]

[[example]]
name = "buses"
required-features = ["cpal"]

[[example]]
name = "live_band"
required-features = ["cpal"]

[[example]]
name = "lofi"
required-features = ["cpal"]

[[example]]
name = "playground"
required-features = ["cpal"]

[features]
default = ["analysis", "sampler"]
# Spectral analysis + spectrogram/waveform PNGs (the authoring/critique surface).
analysis = ["dep:image", "dep:rustfft"]
# SoundFont (.sf2) sampler instrument — pulls in rustysynth + file I/O.
sampler = ["dep:rustysynth"]
# Native speaker output (`speaker` module): the cpal adapter the CLI's `play`
# feature, the Python bindings and the examples share. Needs ALSA on Linux.
cpal = ["dep:cpal"]
