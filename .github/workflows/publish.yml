name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v1.11.0"
        required: true
        type: string

permissions:
  contents: read

# Publishes the two registry crates to crates.io: `tono-core` first, then the
# `tono` CLI once the index serves the new core (cargo strips the path dep and
# pins the crates.io version, so core must be indexed first). Authentication is
# the CRATES_API_TOKEN secret in the `production` GitHub Environment (crates.io
# API token, publish-update scope — same convention as bevy_tono), mapped to
# CARGO_REGISTRY_TOKEN for cargo. Idempotent: a version already on crates.io is
# skipped, so re-running a published tag is a no-op. The GitHub Release +
# binaries are release.yml's job; this workflow never touches them.
jobs:
  crates:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      UA: "tono-ci (https://github.com/marmikshah/tono)"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release configuration
        run: python scripts/release.py check-version "$TAG"
      - name: Publish tono-core
        run: |
          if curl -sf -H "User-Agent: $UA" https://index.crates.io/to/no/tono-core | grep -qF "\"vers\":\"${TAG#v}\""; then
            echo "tono-core ${TAG#v} already on crates.io — skipping"
          else
            cargo publish --locked -p tono-core
          fi
      - name: Wait for crates.io to index tono-core
        run: |
          for i in $(seq 1 20); do
            if curl -sf -H "User-Agent: $UA" https://index.crates.io/to/no/tono-core | grep -qF "\"vers\":\"${TAG#v}\""; then
              echo "tono-core ${TAG#v} indexed"
              exit 0
            fi
            sleep 15
          done
          echo "::error::tono-core ${TAG#v} still not indexed after 5 minutes"
          exit 1
      - name: Publish tono (CLI)
        run: |
          if curl -sf -H "User-Agent: $UA" https://index.crates.io/to/no/tono | grep -qF "\"vers\":\"${TAG#v}\""; then
            echo "tono ${TAG#v} already on crates.io — skipping"
          else
            cargo publish --locked -p tono
          fi
