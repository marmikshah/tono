name: Rust gate

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: "1.88.0"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux native dependencies
        # ALSA for the core `cpal` speaker feature (exercised by --all-features,
        # the CLI's `play` feature and tono-py).
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check release configuration
        run: python scripts/release.py check-version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every crate and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test every crate and feature
        run: cargo test --locked --workspace --all-features
      - name: Check lean and independent core features
        shell: bash
        run: |
          cargo test --locked -p tono-core --no-default-features
          for features in '' analysis sampler; do
            cargo clippy --locked -p tono-core --all-targets --no-default-features --features "$features" -- -D warnings
          done
      - name: Test the CLI as installed by default (no optional features)
        run: |
          cargo test --locked -p tono
          cargo clippy --locked -p tono --all-targets -- -D warnings
      - name: Run deterministic soak checks
        run: cargo test --locked -p tono-core --test soak -- --ignored
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build and test the installed Python wheel
        run: |
          python -m pip install maturin
          maturin build --locked --release --out dist -m crates/tono-py/Cargo.toml
          python scripts/wheel_test.py dist
      - uses: actions/setup-python@v5
        if: inputs.toolchain == '1.88.0'
        with:
          python-version: "3.9"
      - name: Check the minimum supported Python
        if: inputs.toolchain == '1.88.0'
        run: python scripts/wheel_test.py dist
