name: Rust gate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      toolchain:
        type: string
        default: "1.88.0"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check release configuration
        run: python scripts/release.py check-version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every crate and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test every crate and feature
        run: cargo test --locked --workspace --all-features
      - name: Check lean and independent core features
        shell: bash
        run: |
          cargo test --locked -p tono-core --no-default-features
          for features in '' analysis sampler; do
            cargo clippy --locked -p tono-core --all-targets --no-default-features --features "$features" -- -D warnings
          done
      - name: Run deterministic soak checks
        run: cargo test --locked -p tono-core --test soak -- --ignored
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build all release targets
        run: cargo build --locked --workspace --all-features --release
      - name: Build and test the installed Python wheel
        run: |
          python -m pip install maturin
          maturin build --locked --release --out dist -m crates/tono-py/Cargo.toml
          python scripts/wheel_test.py dist
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux' && inputs.toolchain == '1.88.0'
        with:
          python-version: "3.9"
      - name: Check the minimum supported Python
        if: runner.os == 'Linux' && inputs.toolchain == '1.88.0'
        run: python scripts/wheel_test.py dist
