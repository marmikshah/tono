name: Pages

# Builds the VitePress docs site (sources in docs/) and deploys it to GitHub
# Pages on every master push that touches the docs or the site config.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/site-audio.mjs"
      - "crates/tono-cli/examples/site_samples.rs"
      - "crates/tono-cli/Cargo.toml"
      - "crates/tono-core/Cargo.toml"
      - "crates/tono-core/src/**"
      - "tsconfig.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
