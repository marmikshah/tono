name: Wheels

# Builds and tests the tono-py wheel and sdist and uploads them as the
# `wheels-linux-x86_64` artifact. A manual run stops there; release.yml calls
# it for the commit being released and publishes the artifact to PyPI.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/release.py check-version
      - uses: PyO3/maturin-action@v1
        # The sdist lets pip build from source on platforms without a wheel
        # (it bundles the path dependency on tono-core). A separate step: the
        # combined `build --sdist` form failed its wheel build locally.
        with:
          command: sdist
          args: --out dist -m crates/tono-py/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          args: --release --locked --out dist -m crates/tono-py/Cargo.toml
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y alsa-lib-devel; fi
            if command -v apt-get >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y libasound2-dev
            fi
      - name: Test the wheel in a clean environment
        run: python scripts/wheel_test.py dist
      - name: Write artifact checksums
        run: python scripts/release.py checksums dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
          if-no-files-found: error
