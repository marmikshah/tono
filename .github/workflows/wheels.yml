name: Wheels

# Manual wheel artifacts complement source installation without tag builds.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/release.py check-version
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          args: --release --locked --out dist -m crates/tono-py/Cargo.toml
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y alsa-lib-devel; fi
            if command -v apt-get >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y libasound2-dev
            fi
      - name: Test the wheel in a clean environment
        run: python scripts/wheel_test.py dist
      - name: Write artifact checksums
        run: python scripts/release.py checksums dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
          if-no-files-found: error
