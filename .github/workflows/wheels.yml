name: Wheels

# Builds the tono-py wheel and sdist. A manual run uploads them as a workflow
# artifact; a release tag also publishes them to PyPI through trusted
# publishing (the `pypi` environment, no stored token).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/release.py check-version ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: PyO3/maturin-action@v1
        # The sdist lets pip build from source on platforms without a wheel
        # (it bundles the path dependency on tono-core). A separate step: the
        # combined `build --sdist` form failed its wheel build locally.
        with:
          command: sdist
          args: --out dist -m crates/tono-py/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          args: --release --locked --out dist -m crates/tono-py/Cargo.toml
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y alsa-lib-devel; fi
            if command -v apt-get >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y libasound2-dev
            fi
      - name: Test the wheel in a clean environment
        run: python scripts/wheel_test.py dist
      - name: Write artifact checksums
        run: python scripts/release.py checksums dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
          if-no-files-found: error
  pypi:
    if: github.ref_type == 'tag'
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Drop the checksum sidecars
        run: rm -f dist/*.sha256
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A re-run of a tag must not fail on files already uploaded.
          skip-existing: true
