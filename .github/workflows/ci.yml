name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bench:
        description: Run report-only Criterion benchmarks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event_name == 'workflow_dispatch' && inputs.bench)
    uses: ./.github/workflows/ci-rust.yml
  platforms:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event_name == 'workflow_dispatch' && inputs.bench)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, toolchain: "1.88.0" }
          - { runner: windows-latest, toolchain: "1.88.0" }
          - { runner: ubuntu-latest, toolchain: stable }
    uses: ./.github/workflows/ci-rust.yml
    with:
      runner: ${{ matrix.runner }}
      toolchain: ${{ matrix.toolchain }}
  dependencies:
    if: github.event_name != 'workflow_dispatch' || !inputs.bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
  status:
    # Preserve the existing protected check while sharing the actual gate.
    name: ci
    needs: [ci, platforms, dependencies]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event_name == 'workflow_dispatch' && inputs.bench)
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), os.environ["RESULTS"]'
  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked -p tono-core 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: |
            bench.txt
            target/criterion
          retention-days: 30
