# Supply-chain policy: checked in CI and locally with
# `cargo deny check advisories licenses`.

[licenses]
# The tono dependency tree is permissively licensed; anything outside this
# list is a release blocker to resolve, not to allow by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
]
# Default: fail on unlicensed crates.
confidence-threshold = 0.8

[advisories]
# RustSec advisories against Cargo.lock. Unmaintained crates warn when
# they're direct workspace dependencies (transitive quietness is tracked
# noise); vulnerabilities and yanked versions fail.
yanked = "deny"
unmaintained = "workspace"

[bans]
# Duplicate versions of one crate warn (tracked, not blocked); build scripts
# and executables from dependencies are allowed by default.
multiple-versions = "warn"
wildcards = "warn"
