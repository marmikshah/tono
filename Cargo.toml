[workspace]
# A virtual manifest can't infer the resolver from a root package's edition, so
# pin it: edition 2024 members imply resolver "3".
resolver = "3"
members = [
    "crates/tono-cli",
    "crates/tono-core",
    "crates/tono-desktop",
    "crates/tono-play",
    "crates/tono-py",
]
# Core and CLI need no native GUI/audio packages. CI also checks the desktop,
# speaker adapter and Python extension with their platform dependencies.
default-members = ["crates/tono-cli", "crates/tono-core"]

[workspace.package]
version = "1.11.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/marmikshah/tono"
description = "A deterministic sound engine — synthesis, instruments, songs, and adaptive game music, rendered byte-identically to audio."

[workspace.dependencies]
# The version must match workspace.package.version above: cargo strips `path` at
# publish time and pins the crates.io dependency to this version. Bump both together.
tono-core = { path = "crates/tono-core", version = "1.11.0" }
anyhow = "1.0.102"
base64 = "0.22.1"
cpal = "0.15.3"
criterion = "0.5"
flacenc = { version = "0.4", default-features = false }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
midly = "0.5"
proptest = "1"
rustfft = "6.4.1"
rustysynth = "1.3.6"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
tracing = "0.1.44"
vorbis_rs = "0.5.5"
